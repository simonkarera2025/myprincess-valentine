<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine 💘</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 15px 30px rgba(0,0,0,0.2);
      animation: pop 0.8s ease;
      position: relative;
      z-index: 2;
    }

    @keyframes pop {
      from { transform: scale(0.6); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    h1 {
      color: #e63946;
    }

    button {
      padding: 12px 26px;
      font-size: 16px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin: 10px;
      transition: all 0.3s ease;
      position: relative;
    }

    #yes {
      background: #38b000;
      color: white;
    }

    #no {
      background: #adb5bd;
    }

    #message {
      display: none;
      font-size: 20px;
      color: #e63946;
      margin-top: 20px;
    }

    /* floating hearts */
    .heart {
      position: absolute;
      color: rgba(255,0,80,0.6);
      font-size: 20px;
      animation: floatUp 6s linear infinite;
    }

    @keyframes floatUp {
      from {
        transform: translateY(100vh) scale(1);
        opacity: 1;
      }
      to {
        transform: translateY(-10vh) scale(1.5);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <!-- background music -->
  <audio autoplay loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <div class="card">
    <h1>MyPrincess 👑</h1>
    <p>Will you be my Valentine? 💘</p>

    <button id="yes" onclick="yesClicked()">Yes 💖</button>
    <button id="no" onmouseover="runAway()" onclick="noClicked()">No 🙃</button>

    <p id="message">
      Yaaay!! 💕  
      My Princess said yes 🥹  
      Happy Valentine’s Day, <strong>Mrs. Karera</strong> 👑  
      <br>— Yours, Valentino 😌
    </p>
  </div>

  <script>
    let noCount = 0;

    function runAway() {
      const noBtn = document.getElementById("no");
      const x = Math.random() * 200 - 100;
      const y = Math.random() * 200 - 100;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    }

    function noClicked() {
      noCount++;
      document.getElementById("no").innerText = "Please 🥺";
      document.getElementById("yes").style.transform =
        `scale(${1 + noCount * 0.25})`;
    }

    function yesClicked() {
      document.getElementById("yes").style.display = "none";
      document.getElementById("no").style.display = "none";
      document.getElementById("message").style.display = "block";
    }

    // create floating hearts
    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerText = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = Math.random() * 20 + 15 + "px";
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 6000);
    }, 500);
  </script>

</body>
</html>
